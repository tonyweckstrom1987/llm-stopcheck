name: Julkaise PyPI:hin

# Ajetaan vain kun GitHubissa julkaistaan release. PyPI Trusted Publishing (OIDC): ei salaisuuksia repossa.
# Ennen ensimmaista julkaisua: PyPI -> Publishing -> lisaa "pending publisher" (omistaja tonyweckstrom1987,
# repo llm-stopcheck, workflow julkaise.yml, environment pypi).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  rakenna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Testit
        run: python -m unittest discover -s tests -t .
      - name: Rakenna paketti
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  julkaise:
    needs: rakenna
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
